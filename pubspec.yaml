name: asr_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  record: ^6.2.0
  # Pinned to 1.6.x because 1.7.0 added a `makeBackgroundTaskQueue` call in
  # its macOS register(with:), and that selector doesn't exist on the macOS
  # Flutter engine yet (open TODO(gaaclarke) in the engine header). 1.7.0
  # crashes at launch on macOS Flutter 3.41.x. Bump the upper bound once
  # the upstream Flutter macOS engine implements the selector.
  flutter_onnxruntime: ">=1.6.4 <1.7.0"
  fftea: ^1.5.0+1
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^3.6.1
  crypto: ^3.0.6
  file_picker: ^8.0.0
  flutter_markdown_plus: ^1.0.7
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mockito: ^5.6.4
  meta: ^1.17.0
  fake_async: ^1.3.3
  snaptest: ^0.3.0
  flutter_launcher_icons: ^0.14.4
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/silero_vad.onnx
    - assets/markdown/docs/

  fonts:
    - family: Arial
      fonts:
        - asset: fonts/Arial/Arial-Regular.ttf
        - asset: fonts/Arial/Arial-Narrow-Italic.ttf
          style: italic
    - family: RobotoSlab
      fonts:
        - asset: fonts/RobotoSlab/RobotoSlab-Regular.ttf
        - asset: fonts/RobotoSlab/RobotoSlab-Bold.ttf
          weight: 700
        - asset: fonts/RobotoSlab/RobotoSlab-ExtraBold.ttf
          weight: 900
