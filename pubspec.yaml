name: asr_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  record: ^6.2.0
  # Pinned to 1.6.x because 1.7.0 added a `makeBackgroundTaskQueue` call in
  # its macOS register(with:), and that selector doesn't exist on the macOS
  # Flutter engine yet (open TODO(gaaclarke) in the engine header). 1.7.0
  # crashes at launch on macOS Flutter 3.41.x. Bump the upper bound once
  # the upstream Flutter macOS engine implements the selector.
  flutter_onnxruntime: ">=1.6.4 <1.7.0"
  fftea: ^1.5.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mockito: ^5.6.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - test/services/token_decoder/test_vocab.txt
    - assets/EnglishGigaspeechConformerFBank_M01/vocab.txt
    - assets/EnglishGigaspeechConformerFBank_M01/full/default_encoder.onnx
    - assets/EnglishGigaspeechConformerFBank_M01/full/ctc.onnx

  fonts:
    - family: Arial
      fonts:
        - asset: fonts/Arial/Arial Regular.ttf
        - asset: fonts/Arial/Arial Narrow Italic.ttf
          style: italic
    - family: RobotoSlab
      fonts:
        - asset: fonts/RobotoSlab/RobotoSlab-Regular.ttf
        - asset: fonts/RobotoSlab/RobotoSlab-Bold.ttf
          weight: 700
        - asset: fonts/RobotoSlab/RobotoSlab-ExtraBold.ttf
          weight: 900
